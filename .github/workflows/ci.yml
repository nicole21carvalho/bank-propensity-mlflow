name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O GITHUB_TOKEN so le o codigo.
permissions:
  contents: read

# Actions fixadas por SHA do commit, e nao por tag: tag pode ser movida para outro codigo depois; SHA nao.
# O comentario diz a versao, e o Dependabot abre PR quando sai outra.

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  testes:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Instalar dependencias
        # --frozen: falha se o uv.lock nao bater com o pyproject.toml, em vez de resolver versoes novas em silencio.
        run: uv sync --frozen

      - name: Lint (Ruff, com as regras de seguranca do Bandit)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Testes (dados sinteticos, sem internet)
        run: uv run pytest

  treino:
    name: Treino com a base real e experimentos do MLflow
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      - name: Exploracao em SQL (baixa a base da UCI e confere o SHA-256)
        run: uv run mira-explorar

      - name: Treino e comparacao dos modelos
        run: uv run mira-treinar

      - name: Resultados conferem com os do README
        # Sementes fixas: se os numeros mudarem alem da tolerancia, o README esta desatualizado. A exploracao em
        # SQL e exata; as metricas dos modelos podem variar na ultima casa entre Windows e Linux.
        run: |
          git diff --exit-code -- docs/exploracao.md
          git show HEAD:docs/resultados.json > "$RUNNER_TEMP/esperado.json"
          uv run python -m mira.conferir "$RUNNER_TEMP/esperado.json" docs/resultados.json

      - name: Publicar os experimentos do MLflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimentos-mlflow
          path: |
            mlflow.db
            mlartifacts/
            docs/
          retention-days: 30

  vulnerabilidades:
    name: Dependencias com vulnerabilidade conhecida
    runs-on: ubuntu-latest
    env:
      OSV_VERSAO: v2.6.0
      OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar osv-scanner
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSAO}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner

      - name: Varredura do uv.lock
        run: ./osv-scanner scan source -L uv.lock
